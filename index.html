<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valencia Reading Room — New Member Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1F2A1E;
    --felt: #24352B;
    --felt-dark: #182019;
    --parchment: #EFE3C0;
    --parchment-edge: #E0CFA0;
    --stamp-red: #8C2F26;
    --gold: #B08A3E;
    --muted: #6B6152;
    --paper-line: rgba(31,42,30,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(ellipse at 80% 90%, rgba(0,0,0,0.25), transparent 50%),
      var(--felt);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px 80px;
  }
  .stage{
    width:100%;
    max-width:620px;
    position:relative;
  }
  .masthead{
    text-align:center;
    color:var(--parchment);
    margin-bottom:28px;
  }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(32px, 6vw, 46px);
    margin:0;
    line-height:1.05;
  }

  .card{
    background:var(--parchment);
    border:1px solid var(--parchment-edge);
    border-radius:5px;
    box-shadow:0 22px 45px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.25) inset;
    padding:38px 38px 32px;
    position:relative;
    background-image: repeating-linear-gradient(var(--parchment), var(--parchment) 33px, var(--paper-line) 34px);
    background-position: 0 92px;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:linear-gradient(var(--stamp-red), var(--gold));
    border-radius:5px 0 0 5px;
  }

  .stamp{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--stamp-red);
    border:2px solid var(--stamp-red);
    padding:6px 12px;
    border-radius:3px;
    transform:rotate(-2deg);
    margin-bottom:22px;
  }
  .stamp .num{
    font-weight:600;
  }

  h2.section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 6px;
  }
  .section-sub{
    color:var(--muted);
    font-size:14px;
    margin:0 0 26px;
    line-height:1.5;
  }

  .intro-text{
    font-size:15.5px;
    line-height:1.7;
    color:var(--ink);
  }
  .intro-text strong{color:var(--stamp-red);}

  .q{ margin-bottom:24px; }
  .q label{
    display:block;
    font-weight:600;
    font-size:15px;
    margin-bottom:8px;
  }
  .q .hint{
    display:block;
    font-weight:400;
    font-size:12.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .q input[type=text], .q textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    padding:10px 12px;
    border:none;
    border-bottom:1.5px dashed rgba(31,42,30,0.35);
    background:transparent;
    color:var(--ink);
    resize:vertical;
  }
  .q input[type=text]:focus, .q textarea:focus{
    outline:none;
    border-bottom:1.5px solid var(--stamp-red);
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    font-size:13px;
    padding:7px 13px;
    border-radius:16px;
    border:1.5px solid rgba(31,42,30,0.3);
    background:rgba(255,255,255,0.25);
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
  }
  .chip:hover{ border-color:var(--stamp-red); }
  .chip.selected{
    background:var(--stamp-red);
    border-color:var(--stamp-red);
    color:var(--parchment);
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:30px;
    padding-top:18px;
    border-top:1px solid rgba(31,42,30,0.18);
  }
  button.btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:11px 20px;
    border-radius:3px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
  }
  button.btn:hover{ background:var(--ink); color:var(--parchment); }
  button.btn.primary{
    background:var(--stamp-red);
    border-color:var(--stamp-red);
    color:var(--parchment);
  }
  button.btn.primary:hover{ opacity:.88; background:var(--stamp-red); }
  button.btn:disabled{ opacity:.3; cursor:not-allowed; }
  button.btn:disabled:hover{ background:transparent; color:var(--ink); }

  .ribbon{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:22px 0 6px;
  }
  .ribbon .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(239,227,192,0.25);
    border:1.5px solid rgba(239,227,192,0.5);
    transition:all .2s ease;
  }
  .ribbon .dot.active{ background:var(--gold); border-color:var(--gold); }
  .ribbon .dot.done{ background:var(--parchment); border-color:var(--parchment); }

  .review pre{
    white-space:pre-wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    line-height:1.7;
    background:rgba(255,255,255,0.35);
    padding:16px;
    border-radius:4px;
    max-height:360px;
    overflow-y:auto;
    border:1px dashed rgba(31,42,30,0.3);
  }
  .action-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
  }
  .copied-msg{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--stamp-red);
    margin-left:6px;
    opacity:0;
    transition:opacity .2s ease;
  }
  .copied-msg.show{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    .chip, button.btn, .ribbon .dot{ transition:none; }
  }
  @media (max-width:480px){
    .card{ padding:26px 22px 24px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="masthead">
    <div class="eyebrow">Valencia Reading Room</div>
    <h1>New Member Card</h1>
  </div>

  <div class="card" id="card"></div>

  <div class="ribbon" id="ribbon"></div>
</div>

<script>
const sections = [
  { key: 'intro', title: null },
  { key:'how', label:"Let's Get Started", questions: [
      { id:'lead_commit', label:"In our first meeting we'll nominate and vote on our first book — I get that if my pick is chosen, I'll lead the next discussion.", type:'chips', single:true, options:['Yes, obviously','Let’s talk about it','Nervous but willing'] },
      { id:'questions_prep', label:"When it's my turn to lead, I'll come with 5 discussion questions — pulled together myself, from Reddit, AI, wherever works.", type:'chips', single:true, options:['Sounds good','Could use a template to start from'] },
      { id:'discussion_style', label:"The kind of book that makes for the best discussion, to me, is one that…", hint:"choose as many as apply", type:'chips', options:['Has a twist to unpack','Tackles a big moral question','Teaches me something new','Makes me feel something','All of the above','Other'], allowOther:true },
  ]},
  { key:'schedule', label:'Schedule & Location', questions: [
      { id:'frequency', label:"I can realistically commit to meeting…", type:'chips', single:true, options:['Once a month','Every 6 weeks','Every two months'] },
      { id:'time', label:"My preferred day/time is usually…", hint:"choose as many as apply", type:'chips', options:['Weekday evenings','Weekend afternoons','Weekend evenings'] },
      { id:'top_days', label:"The top three days of the week for me to meet are…", hint:"choose up to 3", type:'chips', options:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] },
      { id:'neighborhoods_easy', label:"What neighborhoods are easiest for you?", hint:"choose as many as apply", type:'chips', options:['Ciutat Vella (Old Town)','L\'Eixample (Ensanche)','El Cabanyal/La Malvarrosa','Quatre Carreres','All those work for me','Other'], allowOther:true },
      { id:'venue', label:"When it comes to location, I'm picturing us at…", type:'chips', single:true, options:['A cozy cafe','A restaurant we can hang at','Rotating between a few spots','Open to whatever'] },
      { id:'neighborhood', label:"I think this would be a great place for us to try meeting (cafe, restaurant, etc)…", type:'text' },
  ]},
  { key:'review', label:'Review' }
];

let current = 0;
const answers = {};

function renderRibbon(){
  const r = document.getElementById('ribbon');
  r.innerHTML = '';
  sections.forEach((s, i) => {
    if (s.key === 'intro') return;
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === current ? ' active' : i < current ? ' done' : '');
    r.appendChild(dot);
  });
}

function chipMulti(qid, opt){
  if (!answers[qid]) answers[qid] = [];
  const idx = answers[qid].indexOf(opt);
  if (idx > -1) answers[qid].splice(idx,1); else answers[qid].push(opt);
  renderCard();
}
function chipSingle(qid, opt){
  answers[qid] = opt;
  renderCard();
}
function textChange(qid, val){
  answers[qid] = val;
}

function questionHTML(q){
  let inner = '';
  if (q.type === 'text'){
    inner = `<textarea rows="2" oninput="textChange('${q.id}', this.value)" placeholder="Type your answer…">${answers[q.id] || ''}</textarea>`;
    if (q.allowLink){
      inner += `<input type="text" style="margin-top:10px;" oninput="textChange('${q.id}_link', this.value)" placeholder="${q.linkLabel || 'Link (optional)'} — paste URL here" value="${answers[q.id + '_link'] || ''}">`;
    }
  } else {
    const chips = q.options.map(opt => {
      const selected = q.single ? answers[q.id] === opt : (answers[q.id] || []).includes(opt);
      const fn = q.single ? `chipSingle('${q.id}', '${opt.replace(/'/g, "\\'")}')` : `chipMulti('${q.id}', '${opt.replace(/'/g, "\\'")}')`;
      return `<div class="chip${selected ? ' selected' : ''}" onclick="${fn}">${opt}</div>`;
    }).join('');
    inner = `<div class="chips">${chips}</div>`;
    if (q.allowOther){
      const selectedArr = q.single ? [answers[q.id]] : (answers[q.id] || []);
      if (selectedArr.includes('Other')){
        inner += `<textarea rows="2" style="margin-top:10px;" oninput="textChange('${q.id}_other', this.value)" placeholder="Tell us more…">${answers[q.id + '_other'] || ''}</textarea>`;
      }
    }
  }
  return `<div class="q"><label>${q.label}${q.hint ? `<span class="hint">${q.hint}</span>` : ''}</label>${inner}</div>`;
}

function buildSummary(){
  let out = "VALENCIA READING ROOM — NEW MEMBER CARD\n" + "=".repeat(30) + "\n\n";
  sections.forEach(s => {
    if (!s.questions) return;
    out += s.label.toUpperCase() + "\n";
    s.questions.forEach(q => {
      let val = answers[q.id];
      if (Array.isArray(val)) val = val.join(', ');
      if (q.allowOther && answers[q.id + '_other']){
        val = (val && val.length ? val : '') + ` (Other: ${answers[q.id + '_other']})`;
      }
      if (q.allowLink && answers[q.id + '_link']){
        val = (val && val.length ? val : '') + `\n  Link: ${answers[q.id + '_link']}`;
      }
      out += "- " + q.label + "\n  " + (val && val.length ? val : '(no answer)') + "\n";
    });
    out += "\n";
  });
  return out;
}

function whatsappSummary(){
  const text = encodeURIComponent(buildSummary());
  window.open(`https://wa.me/34676247723?text=${text}`, '_blank');
}

function copySummary(){
  const text = buildSummary();
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copiedMsg');
    if (msg){ msg.classList.add('show'); setTimeout(() => msg.classList.remove('show'), 2200); }
  });
}

function goNext(){ if (current < sections.length - 1) { current++; renderCard(); renderRibbon(); window.scrollTo({top:0, behavior:'smooth'}); } }
function goBack(){ if (current > 0) { current--; renderCard(); renderRibbon(); window.scrollTo({top:0, behavior:'smooth'}); } }

function renderCard(){
  const card = document.getElementById('card');
  const s = sections[current];

  if (s.key === 'intro'){
    card.innerHTML = `
      <div class="stamp"><span class="num">Welcome</span></div>
      <p class="intro-text">Welcome to the Valencia Reading Room! This is a quick survey to cover general preferences we can build the club around. Takes about 2 minutes. No pressure, there are no wrong answers.</p>
      <div class="nav-row">
        <span></span>
        <button class="btn primary" onclick="goNext()">Let's go →</button>
      </div>
    `;
  } else if (s.key === 'review'){
    card.innerHTML = `
      <div class="stamp"><span class="num">Filed</span></div>
      <h2 class="section-title">Ready to check out</h2>
      <p class="section-sub">Here's your card. Copy it and paste it into an email to Brenda (brenda@doliver.net), or send it straight over on WhatsApp.</p>
      <div class="review"><pre>${buildSummary()}</pre></div>
      <div class="action-row">
        <button class="btn primary" onclick="copySummary()">Copy answers</button>
        <button class="btn" onclick="whatsappSummary()">WhatsApp answers</button>
        <span class="copied-msg" id="copiedMsg">Copied ✓</span>
      </div>
      <div class="nav-row">
        <button class="btn" onclick="goBack()">← Back</button>
        <span></span>
      </div>
    `;
  } else {
    const idx = sections.filter(x => x.questions).indexOf(s) + 1;
    card.innerHTML = `
      <div class="stamp"><span class="num">${String(idx).padStart(2,'0')}</span> ${s.label}</div>
      <h2 class="section-title">${s.label}</h2>
      ${s.questions.map(questionHTML).join('')}
      <div class="nav-row">
        <button class="btn" onclick="goBack()" ${current === 1 ? 'disabled' : ''}>← Back</button>
        <button class="btn primary" onclick="goNext()">Next →</button>
      </div>
    `;
  }
}

renderCard();
renderRibbon();
</script>
</body>
</html>
